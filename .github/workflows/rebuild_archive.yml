# Rebuild the frozen doc versions and replace the archive in S3.
#
# Versions listed in frozenVersions.json are not built by the daily deploy; their
# HTML is served from S3 and the deploy's sync excludes it so `--delete` cannot
# reach it (see ARCHIVE.md). This workflow is how a frozen version gets changed:
# it restores those versions for one build and writes the whole site, archive
# included.
#
# On demand only - there is deliberately no `schedule`. Running here rather than
# from a laptop is also what makes it usable: the bucket names are
# repository secrets and the AWS role trusts only this repository's main branch.
#
# Because every version is built, this run needs NO frozen excludes - there is
# nothing to protect that is not being uploaded. That is why the sync below is a
# plain mirror and does not use scripts/frozen-sync-flags.js.
name: Rebuild_doc_archive
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which site to rebuild'
        required: true
        default: 'stage'
        type: choice
        options: [stage, prod]
      docBuildBranch:
        description: 'doc-build branch to build with'
        required: true
        default: 'main'
        type: string
env:
  # Assumed through GitHub's OIDC provider instead of stored access keys. The
  # role trusts only StarRocks/doc-build on main, and may only read and write
  # the starrocks-io-docs-* buckets and invalidate CloudFront.
  AWS_ROLE_ARN: arn:aws:iam::081976408565:role/github-actions-doc-build
jobs:
  # One job per locale, then one deploy job, as in prod_deploy_docusaurus.yml.
  #
  # Building every version of all three locales in one job took over an hour,
  # which outlived the one-hour AWS role session and left no way to retry the
  # upload without building again. Split, the locales build in parallel, the
  # build jobs never touch AWS, and a failed upload is retried with "Re-run
  # failed jobs", which reruns only the deploy job against the saved artifacts.
  build:
    name: build (${{ matrix.locale }})
    env:
      INPUTS_BRANCH: "${{ inputs.docBuildBranch || 'main' }}"
      TARGET: "${{ inputs.target }}"
    strategy:
      # Let every locale finish, so one run shows all the failures.
      fail-fast: false
      matrix:
        include:
          # en writes the whole of build/; zh and ja write only build/zh/ and
          # build/ja/. See prod_deploy_docusaurus.yml.
          - locale: en
            artifact_path: build
          - locale: zh
            artifact_path: build/zh
          - locale: ja
            artifact_path: build/ja
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.INPUTS_BRANCH }}

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - uses: actions/cache@v3
        id: cache
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - uses: actions/checkout@v3
        with:
          repository: starrocks/starrocks
          fetch-depth: 0
          path: ./temp

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile

      # The one thing that makes this different from the daily deploy. It puts
      # the frozen versions back into versions.json, which is both Docusaurus's
      # versioning manifest and the list cli.js uses to pick starrocks branches,
      # so the copy and the build both pick them up with no other change.
      - name: Restore frozen versions for this build
        run: node scripts/unfreeze-for-rebuild.js

      - name: Copy docs from the starrocks repo
        run: npm run copy

      - name: Check CloudFront markdown exclusions are in sync
        if: matrix.locale == 'en'
        run: node scripts/check-cloudfront-excludes.js

      # One locale per `yarn build`. Same constraints as the deploy workflows -
      # see the comment there.
      - name: Build website (${{ matrix.locale }})
        run: |
          if [ "$TARGET" = "stage" ]; then
            export SITE_URL=https://docs-stage.starrocks.io
          fi
          export NODE_OPTIONS="--max_old_space_size=12288"
          export DOCUSAURUS_PERF_LOGGER=false
          export DOCUSAURUS_IGNORE_SSG_WARNINGS=true
          export BROWSERSLIST_IGNORE_OLD_DATA=true
          # Same Ask AI backend as the deploy workflows. Without it the pages
          # fall back to the CopilotKit widget, and frozen pages keep whatever
          # this build gives them until the next rebuild.
          export ASK_AI_URL=https://knowledge.celerdata.com/sr-community/api/ask
          yarn build --locale "${{ matrix.locale }}"

      - name: Post-process llms.txt and markdown for agents
        if: matrix.locale == 'en'
        env:
          SITE_URL: ${{ inputs.target == 'stage' && 'https://docs-stage.starrocks.io' || '' }}
        run: node scripts/llms-postprocess.js build

      - name: Check sitemap markdown coverage
        if: matrix.locale == 'en'
        run: node scripts/check-sitemap-markdown-coverage.js build

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.locale }}
          path: ${{ matrix.artifact_path }}
          include-hidden-files: true
          # Long enough to re-run a failed deploy the next day, short enough
          # not to pile up storage.
          retention-days: 3
          if-no-files-found: error
          compression-level: 1

  deploy:
    # Only when every locale built. A partial site would --delete the missing
    # locale's pages, archive included, from the bucket.
    needs: build
    env:
      INPUTS_BRANCH: "${{ inputs.docBuildBranch || 'main' }}"
      TARGET: "${{ inputs.target }}"
    runs-on: ubuntu-24.04-arm
    # id-token: write lets this job request the OIDC token it exchanges for the
    # AWS role. Only the jobs that touch AWS get it.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    steps:
      # Only frozenVersions.json is needed, for the archive check.
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.INPUTS_BRANCH }}

      - uses: actions/setup-node@v3
        with:
          node-version: 24

      # en first: it is the root of the tree the other two land inside.
      - name: Download the en site
        uses: actions/download-artifact@v4
        with:
          name: site-en
          path: build

      - name: Download the zh site
        uses: actions/download-artifact@v4
        with:
          name: site-zh
          path: build/zh

      - name: Download the ja site
        uses: actions/download-artifact@v4
        with:
          name: site-ja
          path: build/ja

      # The sync below mirrors with --delete and no frozen excludes, so this is
      # the only thing between a missing archive and deleting it from S3.
      - name: Confirm the archive was actually built
        run: |
          set -uo pipefail
          missing=""
          for page in index.html zh/index.html ja/index.html; do
            [ -f "build/${page}" ] || missing="${missing} ${page}"
          done
          for v in $(node -p "require('./frozenVersions.json').join(' ')"); do
            for root in "" "zh/" "ja/"; do
              [ -f "build/${root}docs/${v}/introduction/index.html" ] || missing="${missing} ${root}docs/${v}"
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing from the downloaded build - refusing to sync:${missing}"
            echo "A mirroring sync now would DELETE these from S3. See ARCHIVE.md."
            exit 1
          fi
          echo "Site and archive present in build/ for every locale and frozen version."
          du -sh build build/zh build/ja

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: doc-build-${{ github.run_id }}
          aws-region: us-west-2

      - name: Replace the site, archive included
        env:
          BUCKET_SECRET: ${{ inputs.target == 'prod' && secrets.AWS_OSS_DOCS_PROD_BUCKET || secrets.AWS_OSS_DOCS_STAGE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${BUCKET_SECRET:-}" ]; then
            echo "::error::No bucket configured for target '$TARGET'"
            exit 1
          fi
          # Assets first and additive, as in the deploy workflows: the rebuilt
          # pages reference new hashed chunks, and nothing should 404 on its JS
          # in between.
          aws s3 sync build/ s3://$BUCKET_SECRET/ --only-show-errors \
            --exclude "*" \
            --include "assets/*" --include "zh/assets/*" --include "ja/assets/*"

          # Then mirror everything else. No frozen excludes: this build contains
          # every version, so there is nothing to protect from --delete, and
          # excluding the archive here would mean the rebuilt pages were never
          # uploaded. The step above refuses to reach this point if the archive
          # is missing from build/.
          aws s3 sync build/ s3://$BUCKET_SECRET/ --only-show-errors --delete \
            --exclude "assets/*" --exclude "zh/assets/*" --exclude "ja/assets/*"

          aws s3 cp build/ s3://$BUCKET_SECRET/ --only-show-errors --recursive \
            --exclude "*" --include "*.md" \
            --content-type "text/markdown; charset=utf-8"

      - name: clean cdn cache
        env:
          CLOUFRONT_DIST_ID: ${{ inputs.target == 'prod' && secrets.AWS_OSS_DOCS_PROD_CLOUDFRONT_DIST_ID || secrets.AWS_OSS_DOCS_STAGE_CLOUDFRONT_DIST_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUFRONT_DIST_ID --paths "/*"
