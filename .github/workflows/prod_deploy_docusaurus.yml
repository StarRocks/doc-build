name: __Prod__Deploy_docusaurus
on:
  workflow_dispatch:
   inputs:
      docBuildBranch:
        description: 'doc-build branch to build with'     
        required: true
        default: 'main'
        type: string
        
  schedule:
      - cron: "5 10 * * 1-5"
env:
  AWS_KEY: ${{ secrets.AWS_KEY }}
  AWS_SECRET: ${{ secrets.AWS_SECRET }}
jobs:
  prod_deploy:
    env:
      INPUTS_BRANCH: "${{ inputs.docBuildBranch || 'main' }}"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.INPUTS_BRANCH }}

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'
      
      - uses: actions/cache@v3
        id: cache
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-west-2
      
      - uses: actions/checkout@v3
        with:
          repository: starrocks/starrocks
          fetch-depth: 0
          path: ./temp

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile
      
      - run: npm run copy

      # Fails fast if the CloudFront Function's route exclusions have drifted
      # from src/agentDocsRoutes.js — see the script header for why it matters.
      - name: Check CloudFront markdown exclusions are in sync
        run: node scripts/check-cloudfront-excludes.js

      # One locale per `yarn build`. Building all three in a single node process
      # peaks above the runner's heap and gets OOM-killed partway through; a
      # fresh process per locale stays inside the limit.
      #
      # This only works because docusaurus.config.js pins the zh and ja
      # baseUrls — a single `--locale` disables automatic locale-segment
      # inference, so without those pins zh and ja land on build/ and wipe the
      # English site. en must run first: it writes to build/, which Docusaurus
      # clears before writing.
      # A failing locale does not stop the loop. The locales break independently
      # — a broken link in the Japanese translation says nothing about English —
      # and stopping at the first failure hides the rest, so a red build gets
      # fixed one locale per day. All failures are reported together at the end
      # and the step still exits non-zero, so the deploy steps below are skipped.
      - name: Build website
        id: build
        run:  |
          export NODE_OPTIONS="--max_old_space_size=12288"
          export DOCUSAURUS_PERF_LOGGER=false
          export DOCUSAURUS_IGNORE_SSG_WARNINGS=true
          export BROWSERSLIST_IGNORE_OLD_DATA=true
          failed_locales=""
          for locale in en zh ja; do
            echo "::group::build ${locale}"
            if yarn build --locale "${locale}"; then
              echo "locale ${locale}: OK"
            else
              echo "::error::Locale ${locale} failed to build"
              failed_locales="${failed_locales} ${locale}"
            fi
            echo "::endgroup::"
          done
          {
            echo "| locale | result |"
            echo "| --- | --- |"
            for locale in en zh ja; do
              case " ${failed_locales} " in
                *" ${locale} "*) echo "| ${locale} | ❌ failed |" ;;
                *)               echo "| ${locale} | ✅ ok |" ;;
              esac
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "failed_locales=${failed_locales# }" >> "$GITHUB_OUTPUT"
          if [ -n "${failed_locales}" ]; then
            echo "Failed locales:${failed_locales}"
            exit 1
          fi

      - name: Post-process llms.txt and markdown for agents
        run: node scripts/llms-postprocess.js build

      # Archived versions flooding the head of the sitemap makes agent checkers
      # sampling it conclude Accept: text/markdown is ignored — see the script header.
      - name: Check sitemap markdown coverage
        run: node scripts/check-sitemap-markdown-coverage.js build

      - name: sync to S3
        env:
          BUCKET_SECRET: ${{ secrets.AWS_OSS_DOCS_PROD_BUCKET }}
        run: |
          set -euo pipefail
          # Versions in frozenVersions.json are no longer built, but their HTML
          # is still served. The sync mirrors build/ onto the bucket ROOT, which
          # is the URL root, so without these excludes `--delete` removes every
          # page of every frozen version. See ARCHIVE.md.
          FROZEN_EXCLUDES="$(node scripts/frozen-sync-flags.js)"
          if [ -z "$FROZEN_EXCLUDES" ]; then
            echo "::error::frozen-sync-flags.js produced no excludes - refusing to sync"
            exit 1
          fi
          echo "Protecting frozen trees: $FROZEN_EXCLUDES"

          # Pass 1: assets, ADDITIVE (no --delete).
          #
          # Frozen pages load content-hashed JS/CSS that this build will never
          # emit again, and Docusaurus puts everything it hashes under the
          # per-locale assets/ dir. Mirroring it would leave the frozen HTML in
          # place but strip every chunk it references.
          #
          # This runs FIRST. Uploading HTML before the chunks it references
          # leaves a window where live pages 404 on their JS - and CloudFront
          # caches those 404s, since the invalidation is the last step.
          # Content-hashed names mean this can never overwrite a file whose
          # contents differ.
          aws s3 sync build/ s3://$BUCKET_SECRET/ --quiet \
            --exclude "*" \
            --include "assets/*" --include "zh/assets/*" --include "ja/assets/*"

          # Pass 2: everything else, mirrored. --delete cannot reach assets/ or
          # the frozen doc trees.
          aws s3 sync build/ s3://$BUCKET_SECRET/ --quiet --delete \
            --exclude "assets/*" --exclude "zh/assets/*" --exclude "ja/assets/*" \
            $FROZEN_EXCLUDES

          # Serve Markdown twins as text/markdown so agents (and content
          # negotiation) get a readable response body, not a file download.
          aws s3 cp build/ s3://$BUCKET_SECRET/ --quiet --recursive \
            --exclude "*" --include "*.md" \
            --content-type "text/markdown; charset=utf-8"

      # Empirical check, not static analysis of the flags above: an aws-cli
      # filter-semantics change or a quoting bug would still pass a lint but
      # would show up here immediately, on the run that caused it, rather than
      # weeks later when somebody follows a link.
      - name: Verify frozen doc trees survived the sync
        env:
          BUCKET_SECRET: ${{ secrets.AWS_OSS_DOCS_PROD_BUCKET }}
        run: |
          set -uo pipefail
          missing=""
          for v in $(node -p "require('./frozenVersions.json').join(' ')"); do
            for root in "docs" "zh/docs" "ja/docs"; do
              key="${root}/${v}/introduction/index.html"
              if ! aws s3api head-object --bucket "$BUCKET_SECRET" --key "$key" >/dev/null 2>&1; then
                missing="${missing} ${key}"
              fi
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::Frozen doc trees are missing from S3:${missing}"
            echo "The archive has been deleted. Do NOT re-run the deploy - see ARCHIVE.md."
            exit 1
          fi
          echo "All frozen doc trees present in s3://<bucket>/."

      # The only chance to record which hashed assets the frozen HTML depends
      # on is a build that still emits every version. Nothing reads this yet; it
      # is what a future assets/ garbage collector needs, since webpack builds
      # chunk URLs from an in-JS id->hash map and the referenced set cannot be
      # recovered by grepping the frozen HTML.
      - name: Capture frozen asset manifest
        if: always()
        run: |
          set -uo pipefail
          ( cd build && find assets zh/assets ja/assets -type f 2>/dev/null | sort ) \
            > frozen-assets-manifest.txt || true
          wc -l frozen-assets-manifest.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-assets-manifest-prod
          path: frozen-assets-manifest.txt
          if-no-files-found: warn

      - name: clean cdn cache
        env:
          CLOUFRONT_DIST_ID: ${{ secrets.AWS_OSS_DOCS_PROD_CLOUDFRONT_DIST_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUFRONT_DIST_ID --paths "/*"

      # Nothing watches these cron runs. Prod was red from 2026-09-03 to
      # 2026-09-15 and served stale docs for 13 days because a build failure is
      # silent unless somebody opens the Actions tab.
      #
      # The step no-ops when SLACK_WEBHOOK is unset, so it is safe to merge
      # before the secret exists. Fires on every failure, not just `schedule` —
      # a dispatched run that nobody stays to watch is the same problem. To
      # restrict it, add `&& github.event_name == 'schedule'` to the condition.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          FAILED_LOCALES: ${{ steps.build.outputs.failed_locales }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "SLACK_WEBHOOK is not set - skipping Slack notification."
            exit 0
          fi
          if [ -n "${FAILED_LOCALES:-}" ]; then
            detail="Locales that failed to build: ${FAILED_LOCALES}"
          else
            detail="Failed outside the build loop - check which step failed in the run log."
          fi
          # jq builds the payload so quotes and newlines in the detail text
          # cannot produce malformed JSON. --fail-with-body makes a rotated or
          # revoked webhook fail this step instead of passing silently: curl
          # exits 0 on an HTTP error otherwise, and Slack reports problems in
          # the response body (it answers a good POST with "ok").
          text=$(printf '%s\n%s\n%s' \
            ":rotating_light: *Prod docs deploy failed* (branch \`${INPUTS_BRANCH}\`, trigger \`${{ github.event_name }}\`)" \
            "${detail}" \
            "${RUN_URL}")
          jq -n --arg t "$text" \
            '{username: "Docs deploy", icon_emoji: ":rotating_light:", text: $t}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
                --data @- "$SLACK_WEBHOOK"
