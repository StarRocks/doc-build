name: __Prod__Deploy_docusaurus
on:
  workflow_dispatch:
   inputs:
      docBuildBranch:
        description: 'doc-build branch to build with'     
        required: true
        default: 'main'
        type: string
        
  schedule:
      # 10:05 AM US Eastern during EDT, so the deploy lands inside the working
      # day and somebody is around to see it fail.
      #
      # GitHub cron is UTC and does not observe DST, so this reads as 9:05 AM
      # Eastern from early November to mid-March. `5 15` would be the winter-
      # correct value but 11:05 AM in summer; EDT covers roughly eight months of
      # the year, so this is the better of the two fixed choices.
      #
      # Scheduled runs are also delayed under GitHub load — the nominal 10:05 UTC
      # run on 2026-09-15 actually started at 10:21 — so don't count on the
      # minute.
      #
      # Stage stays at 09:05 UTC and so still runs first, now five hours ahead
      # instead of one. That lead time is useful rather than merely earlier
      # because a failed stage build posts to Slack.
      - cron: "5 14 * * 1-5"
# actions: read is for the Slack job, which asks the API which locale jobs
# failed. Naming any permission drops the rest, hence contents: read as well.
permissions:
  contents: read
  actions: read
env:
  AWS_KEY: ${{ secrets.AWS_KEY }}
  AWS_SECRET: ${{ secrets.AWS_SECRET }}
  INPUTS_BRANCH: "${{ inputs.docBuildBranch || 'main' }}"
jobs:
  # One job per locale, rather than one job building all three in turn.
  #
  # The locales used to build one after another in a single job: en, zh and ja
  # took 8, 7 and 7 minutes, so 23 of the run's 34 minutes were spent waiting
  # on a build that did not depend on the one before it. In parallel the run is
  # bounded by the slowest locale instead of the sum of all three.
  #
  # It also keeps the property the serial loop was written for: a failing
  # locale does not hide the others. Each locale has its own job, its own
  # result and its own log, and the deploy job only runs when all three built.
  build:
    name: build (${{ matrix.locale }})
    strategy:
      # The locales break independently — a broken link in the Japanese
      # translation says nothing about English — so one failing must not cancel
      # the others and hide whether they would have built.
      fail-fast: false
      matrix:
        include:
          # en is the default locale and writes the whole of build/; zh and ja
          # write only build/zh/ and build/ja/. Uploading each from its own root
          # lets the deploy job drop them back into place without a merge.
          # Spelled out per locale rather than computed, because a GitHub
          # expression has no clean way to say "build/ for en, else build/<locale>".
          - locale: en
            artifact_path: build
          - locale: zh
            artifact_path: build/zh
          - locale: ja
            artifact_path: build/ja
    runs-on: ubuntu-24.04-arm
    # A locale takes ~8 minutes to build plus ~4 of setup. This is headroom,
    # and a bound on a hang, not an expected duration.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.INPUTS_BRANCH }}

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - uses: actions/cache@v3
        id: cache
        with:
          path: ./node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - uses: actions/checkout@v3
        with:
          repository: starrocks/starrocks
          fetch-depth: 0
          path: ./temp

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile

      # Copies every locale, not just this job's. The copy also runs the MDX
      # checker, and the other locales' sources are only a minute of it.
      - run: npm run copy

      # Fails fast if the CloudFront Function's route exclusions have drifted
      # from src/agentDocsRoutes.js — see the script header for why it matters.
      # It reads source, not build output, so one locale is enough.
      - name: Check CloudFront markdown exclusions are in sync
        if: matrix.locale == 'en'
        run: node scripts/check-cloudfront-excludes.js

      # One locale per `yarn build`. Building all three in a single node process
      # peaks above the runner's heap and gets OOM-killed partway through.
      #
      # This only works because docusaurus.config.js pins the zh and ja
      # baseUrls — a single `--locale` disables automatic locale-segment
      # inference, so without those pins zh and ja would write to build/ and
      # render their URLs without the /zh/ or /ja/ prefix.
      - name: Build website (${{ matrix.locale }})
        run:  |
          export NODE_OPTIONS="--max_old_space_size=12288"
          export DOCUSAURUS_PERF_LOGGER=false
          export DOCUSAURUS_IGNORE_SSG_WARNINGS=true
          export BROWSERSLIST_IGNORE_OLD_DATA=true
          yarn build --locale "${{ matrix.locale }}"

      # Both of these read only the en output — the Markdown twins, llms.txt,
      # robots.txt and the sitemaps at the root of build/ — so they run in the
      # en job, before its artifact is uploaded, rather than on the assembled
      # site.
      - name: Post-process llms.txt and markdown for agents
        if: matrix.locale == 'en'
        run: node scripts/llms-postprocess.js build

      # Archived versions flooding the head of the sitemap makes agent checkers
      # sampling it conclude Accept: text/markdown is ignored — see the script header.
      - name: Check sitemap markdown coverage
        if: matrix.locale == 'en'
        run: node scripts/check-sitemap-markdown-coverage.js build

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.locale }}
          path: ${{ matrix.artifact_path }}
          # Each locale ships a .nojekyll from static/. Dropping it would be
          # harmless, but the sync below mirrors with --delete, and the bucket
          # should end up exactly as the single-job build left it.
          include-hidden-files: true
          # The artifact only has to survive until the deploy job picks it up.
          retention-days: 1
          # A locale that built nothing must not reach the deploy job as an
          # empty directory.
          if-no-files-found: error
          # Most of this is HTML, which level 1 still folds down several-fold
          # for a fraction of the CPU the default level 6 costs.
          compression-level: 1

  deploy:
    # Only when every locale built. A partial site would --delete the missing
    # locale's pages from the bucket rather than fail visibly.
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      # Only scripts/ and frozenVersions.json are needed here, for the frozen
      # tree excludes and the check after the sync.
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.INPUTS_BRANCH }}

      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: us-west-2

      # en first: it is the root of the tree the other two land inside.
      - name: Download the en site
        uses: actions/download-artifact@v4
        with:
          name: site-en
          path: build

      - name: Download the zh site
        uses: actions/download-artifact@v4
        with:
          name: site-zh
          path: build/zh

      - name: Download the ja site
        uses: actions/download-artifact@v4
        with:
          name: site-ja
          path: build/ja

      # Fail loudly rather than sync half a site. The artifacts are all that
      # stands between a matrix mistake and a --delete that empties a locale.
      - name: Check the assembled site
        run: |
          set -euo pipefail
          for page in index.html zh/index.html ja/index.html; do
            test -f "build/${page}" \
              || { echo "::error::build/${page} missing from the downloaded artifacts"; exit 1; }
          done
          du -sh build build/zh build/ja

      - name: sync to S3
        env:
          BUCKET_SECRET: ${{ secrets.AWS_OSS_DOCS_PROD_BUCKET }}
        run: |
          set -euo pipefail
          # Versions in frozenVersions.json are no longer built, but their HTML
          # is still served. The sync mirrors build/ onto the bucket ROOT, which
          # is the URL root, so without these excludes `--delete` removes every
          # page of every frozen version. See ARCHIVE.md.
          FROZEN_EXCLUDES="$(node scripts/frozen-sync-flags.js)"
          if [ -z "$FROZEN_EXCLUDES" ]; then
            echo "::error::frozen-sync-flags.js produced no excludes - refusing to sync"
            exit 1
          fi
          echo "Protecting frozen trees: $FROZEN_EXCLUDES"

          # Pass 1: assets, ADDITIVE (no --delete).
          #
          # Frozen pages load content-hashed JS/CSS that this build will never
          # emit again, and Docusaurus puts everything it hashes under the
          # per-locale assets/ dir. Mirroring it would leave the frozen HTML in
          # place but strip every chunk it references.
          #
          # This runs FIRST. Uploading HTML before the chunks it references
          # leaves a window where live pages 404 on their JS - and CloudFront
          # caches those 404s, since the invalidation is the last step.
          # Content-hashed names mean this can never overwrite a file whose
          # contents differ.
          aws s3 sync build/ s3://$BUCKET_SECRET/ --quiet \
            --exclude "*" \
            --include "assets/*" --include "zh/assets/*" --include "ja/assets/*"

          # Pass 2: everything else, mirrored. --delete cannot reach assets/ or
          # the frozen doc trees.
          aws s3 sync build/ s3://$BUCKET_SECRET/ --quiet --delete \
            --exclude "assets/*" --exclude "zh/assets/*" --exclude "ja/assets/*" \
            $FROZEN_EXCLUDES

          # Serve Markdown twins as text/markdown so agents (and content
          # negotiation) get a readable response body, not a file download.
          aws s3 cp build/ s3://$BUCKET_SECRET/ --quiet --recursive \
            --exclude "*" --include "*.md" \
            --content-type "text/markdown; charset=utf-8"

      # Empirical check, not static analysis of the flags above: an aws-cli
      # filter-semantics change or a quoting bug would still pass a lint but
      # would show up here immediately, on the run that caused it, rather than
      # weeks later when somebody follows a link.
      - name: Verify frozen doc trees survived the sync
        env:
          BUCKET_SECRET: ${{ secrets.AWS_OSS_DOCS_PROD_BUCKET }}
        run: |
          set -uo pipefail
          missing=""
          for v in $(node -p "require('./frozenVersions.json').join(' ')"); do
            for root in "docs" "zh/docs" "ja/docs"; do
              key="${root}/${v}/introduction/index.html"
              if ! aws s3api head-object --bucket "$BUCKET_SECRET" --key "$key" >/dev/null 2>&1; then
                missing="${missing} ${key}"
              fi
            done
          done
          if [ -n "$missing" ]; then
            echo "::error::Frozen doc trees are missing from S3:${missing}"
            echo "The archive has been deleted. Do NOT re-run the deploy - see ARCHIVE.md."
            exit 1
          fi
          echo "All frozen doc trees present in s3://<bucket>/."

      # The only chance to record which hashed assets the frozen HTML depends
      # on is a build that still emits every version. Nothing reads this yet; it
      # is what a future assets/ garbage collector needs, since webpack builds
      # chunk URLs from an in-JS id->hash map and the referenced set cannot be
      # recovered by grepping the frozen HTML.
      - name: Capture frozen asset manifest
        if: always()
        run: |
          set -uo pipefail
          ( cd build && find assets zh/assets ja/assets -type f 2>/dev/null | sort ) \
            > frozen-assets-manifest.txt || true
          wc -l frozen-assets-manifest.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-assets-manifest-prod
          path: frozen-assets-manifest.txt
          if-no-files-found: warn

      - name: clean cdn cache
        env:
          CLOUFRONT_DIST_ID: ${{ secrets.AWS_OSS_DOCS_PROD_CLOUDFRONT_DIST_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id $CLOUFRONT_DIST_ID --paths "/*"

  # Nothing watches these cron runs. Prod was red from 2026-09-03 to
  # 2026-09-15 and served stale docs for 13 days because a build failure is
  # silent unless somebody opens the Actions tab.
  #
  # The step no-ops when SLACK_WEBHOOK is unset, so it is safe to merge
  # before the secret exists. Fires on every failure, not just `schedule` —
  # a dispatched run that nobody stays to watch is the same problem. To
  # restrict it, add `&& github.event_name == 'schedule'` to the condition.
  #
  # A job of its own now that the build is split: failure() here is true when
  # any locale job or the deploy failed, and a step inside one of those jobs
  # could only see its own.
  notify:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Notify Slack on failure
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          JOBS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "SLACK_WEBHOOK is not set - skipping Slack notification."
            exit 0
          fi
          # Matrix jobs cannot hand a result to a downstream job, so ask the API
          # which ones failed. The job names are "build (en)" and so on, and
          # a failed deploy shows up as "deploy". A job-level timeout concludes
          # as "cancelled", hence both. An API error must not stop the message
          # going out, so it falls back to pointing at the run.
          failed_jobs=$(curl -sS --fail -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" "${JOBS_URL}?per_page=100" \
            | jq -r '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", ")' \
            2>/dev/null || true)
          if [ -n "${failed_jobs}" ]; then
            detail="Failed jobs: ${failed_jobs}"
          else
            detail="Could not list the failed jobs - check the run log."
          fi
          # jq builds the payload so quotes and newlines in the detail text
          # cannot produce malformed JSON. --fail-with-body makes a rotated or
          # revoked webhook fail this step instead of passing silently: curl
          # exits 0 on an HTTP error otherwise, and Slack reports problems in
          # the response body (it answers a good POST with "ok").
          text=$(printf '%s\n%s\n%s' \
            ":rotating_light: *Prod docs deploy failed* (branch \`${INPUTS_BRANCH}\`, trigger \`${{ github.event_name }}\`)" \
            "${detail}" \
            "${RUN_URL}")
          jq -n --arg t "$text" \
            '{username: "Docs deploy", icon_emoji: ":rotating_light:", text: $t}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
                --data @- "$SLACK_WEBHOOK"
